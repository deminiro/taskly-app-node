name: Test agent

# PR mode: on every same-repo PR, the test-engineer agent analyses the diff and, when warranted,
# writes or updates unit tests; they are re-verified and committed to the PR branch.
# Coverage mode (manual): the agent raises coverage on the selected ref and the result opens a PR.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      packages:
        description: Packages to raise coverage for
        type: choice
        options: [backend frontend, backend, frontend]
        default: backend frontend

permissions: {}

concurrency:
  group: test-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MODE: ${{ github.event_name == 'pull_request' && 'pr' || 'coverage' }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  # Runs the LLM agent. Holds the model token but only a read-only GitHub token; its output is a patch.
  generate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !contains(github.event.pull_request.labels.*.name, 'skip-test-agent'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      has_work: ${{ steps.analyze.outputs.has_work }}
      packages: ${{ steps.analyze.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Analyse changes (skill analyze-pr-changes)
        id: analyze
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INPUT_PACKAGES: ${{ inputs.packages }}
        run: |
          out="$RUNNER_TEMP/out"; mkdir -p "$out"
          if [ "$MODE" = pr ]; then
            node .claude/skills/analyze-pr-changes/scripts/changed-files.mjs "$BASE_SHA" > "$out/changes.json"
            packages=$(node -p "[...new Set(require(process.argv[1]).work.map((p) => p.split('/')[0]))].join(' ')" "$out/changes.json")
          else
            echo '{"files":[],"work":[]}' > "$out/changes.json"
            packages="$INPUT_PACKAGES"
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "has_work=$([ -n "$packages" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "$packages" > "$out/packages.txt"
          cat "$out/changes.json"

      - name: Install and measure baseline coverage
        if: steps.analyze.outputs.has_work == 'true'
        env:
          PACKAGES: ${{ steps.analyze.outputs.packages }}
        run: |
          for pkg in $PACKAGES; do
            npm --prefix "$pkg" ci --no-audit --no-fund
            npm --prefix "$pkg" run test:coverage > /dev/null 2>&1 || echo "::warning::$pkg baseline tests are not green"
            cp "$pkg/coverage/coverage-summary.json" "$RUNNER_TEMP/out/baseline-$pkg.json" 2>/dev/null || true
            rm -rf "$pkg/coverage"
          done

      - name: Build agent prompt
        if: steps.analyze.outputs.has_work == 'true'
        id: prompt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PACKAGES: ${{ steps.analyze.outputs.packages }}
        run: |
          {
            echo 'text<<PROMPT_EOF'
            if [ "$MODE" = pr ]; then
              echo "PR mode. BASE_SHA=$BASE_SHA. Analyse the changes in $BASE_SHA...HEAD with the analyze-pr-changes skill"
              echo "(pass $BASE_SHA to the script), decide which changed source files need new or updated unit tests,"
              echo "write them, verify them with run-tests-and-coverage, and write .test-agent/report.json."
            else
              echo "Coverage mode for packages: $PACKAGES. Raise unit-test coverage of these packages: find untested and"
              echo "under-tested source files from the coverage report (npm --prefix <pkg> run test:coverage), add meaningful"
              echo "tests for their behaviour, aim for at least 90% lines and 85% branches per package, verify, and write"
              echo ".test-agent/report.json (list the source files you covered under analysed_files)."
            fi
            echo 'PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run test-engineer agent
        if: steps.analyze.outputs.has_work == 'true'
        id: agent
        continue-on-error: true
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --agent test-engineer
            --max-turns ${{ env.MODE == 'pr' && '60' || '150' }}
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(npm --prefix backend test*),Bash(npm --prefix frontend test*),Bash(npm --prefix backend run typecheck),Bash(npm --prefix frontend run typecheck),Bash(npm --prefix backend run test:coverage),Bash(npm --prefix frontend run test:coverage),Bash(node .claude/skills/analyze-pr-changes/scripts/changed-files.mjs*),Bash(node .claude/skills/run-tests-and-coverage/scripts/coverage-report.mjs*),Bash(git diff*),Bash(git status*),Bash(git log*)"
            --disallowedTools "WebFetch,WebSearch"

      - name: Package agent output as a patch
        if: always() && steps.analyze.outcome == 'success'
        env:
          HAS_WORK: ${{ steps.analyze.outputs.has_work }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
        run: |
          out="$RUNNER_TEMP/out"
          if [ -f .test-agent/report.json ]; then
            cp .test-agent/report.json "$out/report.json"
          elif [ "$HAS_WORK" != true ]; then
            echo '{"decision":"skipped","reason":"No testable source changes (only docs, config, types, styles, stories or tests changed).","skills_used":["analyze-pr-changes"]}' > "$out/report.json"
          else
            echo "{\"decision\":\"failed\",\"reason\":\"The agent finished without a report (step outcome: $AGENT_OUTCOME).\"}" > "$out/report.json"
          fi
          git add -A
          git diff --cached --binary --no-renames HEAD > "$out/tests.patch"
          git diff --cached --stat HEAD
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.analyze.outcome == 'success'
        with:
          name: test-agent
          path: ${{ runner.temp }}/out
          retention-days: 14

  # Validates the patch and runs the generated tests. No secrets and no write token here,
  # so agent-written test code never runs next to a credential that can push.
  verify:
    needs: generate
    if: needs.generate.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent
          path: ${{ runner.temp }}/agent
      - name: Validate and apply patch
        run: |
          res="$RUNNER_TEMP/result"; mkdir -p "$res"
          patch="$RUNNER_TEMP/agent/tests.patch"
          if [ ! -s "$patch" ]; then echo empty > "$res/patch.txt"; exit 0; fi
          # Validator comes from the checkout, before the agent patch is applied: the agent cannot change it.
          if node .github/scripts/validate-patch.mjs "$patch" > "$res/validation.txt"; then
            git apply "$patch" && echo applied > "$res/patch.txt"
          else
            echo rejected > "$res/patch.txt"; cat "$res/validation.txt"
          fi
      - name: Typecheck, tests and coverage (skill run-tests-and-coverage)
        env:
          PACKAGES: ${{ needs.generate.outputs.packages }}
        run: |
          res="$RUNNER_TEMP/result"
          for pkg in $PACKAGES; do
            npm --prefix "$pkg" ci --no-audit --no-fund
            if npm --prefix "$pkg" run typecheck && npm --prefix "$pkg" run test:coverage -- --reporter=default --reporter=json --outputFile.json="$res/vitest-$pkg.json"; then
              echo passed > "$res/status-$pkg.txt"
            else
              echo failed > "$res/status-$pkg.txt"
            fi
            cp "$pkg/coverage/coverage-summary.json" "$res/coverage-$pkg.json" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-agent-verification
          path: ${{ runner.temp }}/result
          retention-days: 14

  # Holds the write token. Runs no agent-written code: re-validates, applies, commits, comments.
  publish:
    needs: [generate, verify]
    if: always() && needs.generate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref || env.HEAD_SHA }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-agent
          path: ${{ runner.temp }}/agent
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.verify.result != 'skipped'
        continue-on-error: true
        with:
          name: test-agent-verification
          path: ${{ runner.temp }}/result

      - name: Commit verified tests
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          res="$RUNNER_TEMP/result"; patch="$RUNNER_TEMP/agent/tests.patch"
          status=not_run
          for f in "$res"/status-*.txt; do [ -f "$f" ] || continue; [ "$status" = failed ] || status=$(cat "$f"); done
          echo "verify=$status" >> "$GITHUB_OUTPUT"
          [ "$(cat "$res/patch.txt" 2>/dev/null)" = applied ] && [ "$status" = passed ] || exit 0
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::warning::Branch moved since the agent ran; not committing. The newer push gets its own run."
            exit 0
          fi
          node .github/scripts/validate-patch.mjs "$patch"
          git apply --index "$patch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$MODE" = pr ]; then
            git commit -m "test: add/update unit tests for PR #$PR_NUMBER (test-engineer agent)"
            git push origin "HEAD:refs/heads/$HEAD_REF"
          else
            branch="test-agent/coverage-${GITHUB_RUN_ID}"
            git commit -m "test: raise unit-test coverage (test-engineer agent)"
            git push origin "HEAD:refs/heads/$branch"
            url=$(gh pr create --base "${GITHUB_REF_NAME}" --head "$branch" \
              --title "test: raise unit-test coverage (test-engineer agent)" \
              --body "Tests generated by the test-engineer agent in [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and verified by the workflow. Results are in the comment below.")
            echo "pr=${url##*/}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report results on the pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || steps.commit.outputs.pr }}
          REPORT_PATH: ${{ runner.temp }}/agent/report.json
          CHANGES_PATH: ${{ runner.temp }}/agent/changes.json
          AGENT_DIR: ${{ runner.temp }}/agent
          RESULT_DIR: ${{ runner.temp }}/result
          PUSHED_SHA: ${{ steps.commit.outputs.sha }}
          VERIFY_STATUS: ${{ steps.commit.outputs.verify }}
          MODE_LABEL: ${{ github.event_name == 'pull_request' && 'PR' || 'coverage' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node .github/scripts/pr-comment.mjs > "$RUNNER_TEMP/comment.md"
          cat "$RUNNER_TEMP/comment.md" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$PR" ] || exit 0
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- test-agent -->"))) | .id' | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$RUNNER_TEMP/comment.md" > /dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi

      - name: Fail the check when generated tests were rejected or failed
        env:
          VERIFY_STATUS: ${{ steps.commit.outputs.verify }}
        run: |
          [ "$(cat "$RUNNER_TEMP/result/patch.txt" 2>/dev/null)" != rejected ] || { echo "::error::Agent patch touched files outside the test allowlist"; exit 1; }
          [ "$VERIFY_STATUS" != failed ] || { echo "::error::Verification failed"; exit 1; }
          [ "$(node -p "require(process.argv[1]).decision" "$RUNNER_TEMP/agent/report.json")" != failed ] || { echo "::error::Agent failed"; exit 1; }
